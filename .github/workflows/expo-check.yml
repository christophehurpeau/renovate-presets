name: Check expo.json is up to date with the Expo SDKs

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - expo.json
      - generate-expo.json.js

permissions:
  contents: read

jobs:
  expo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run generate-expo.json.js
        run: node generate-expo.json.js

      - name: Check expo.json is unchanged
        # on failure, run `pnpm run generate:expo` and commit expo.json
        run: git diff --exit-code expo.json
